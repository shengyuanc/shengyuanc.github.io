<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管樂禮服線上拍立得（只有署名簽名沒有畫畫）</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between items-center">

    <!-- 頂部導覽列 -->
    <header class="w-full bg-gradient-to-r from-pink-600 via-rose-500 to-purple-600 text-white shadow-md">
        <div class="max-w-3xl mx-auto px-4 py-4 text-center">
            <h1 class="text-lg md:text-xl font-black tracking-wide flex items-center justify-center space-x-2">
                <span>🎺</span>
                <span>線上拍立得預購入口</span>
            </h1>
        </div>
    </header>

    <!-- 主要內容區塊 -->
    <main class="max-w-2xl w-full px-4 py-12 my-auto space-y-8">

        <!-- 標題卡片 -->
        <div class="bg-white rounded-3xl p-6 md:p-10 shadow-sm border border-pink-100 text-center relative overflow-hidden">
            <div class="absolute top-0 right-0 -mr-12 -mt-12 w-40 h-40 bg-pink-100 rounded-full blur-2xl pointer-events-none"></div>
            
            <span class="inline-block px-3 py-1 bg-pink-100 text-pink-700 text-xs font-bold rounded-full mb-4">
                ✨ 限時線上拍立得預購
            </span>
            
            <!-- 活動主標題 -->
            <h2 class="text-2xl md:text-3xl font-black text-slate-900 mb-4 leading-snug">
                管樂禮服線上拍立得<br>
                <span class="text-pink-600 text-lg md:text-2xl font-bold">（只有署名簽名沒有畫畫）</span>
            </h2>

            <!-- 運費優惠提醒 -->
            <div class="inline-flex items-center space-x-2 bg-pink-50 text-pink-800 border border-pink-200 px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold my-2 shadow-sm">
                <i class="fa-solid fa-truck-fast text-pink-600 text-base"></i>
                <span>有買女警拍立得的人不需要運費！</span>
            </div>

            <p class="text-slate-500 text-sm mt-4">
                請點擊下方符合您狀況的按鈕進行前往：
            </p>
        </div>

        <!-- 雙按鈕選擇區 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            
            <!-- 按鈕 1：我有買女警線上拍立得 -->
            <button onclick="goToUrl('hasBought')" 
                class="group relative bg-gradient-to-br from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-white p-6 md:p-8 rounded-3xl shadow-lg hover:shadow-pink-500/30 transition-all duration-300 text-center flex flex-col items-center justify-center transform hover:-translate-y-1">
                <div class="w-14 h-14 bg-white/20 rounded-full flex items-center justify-center text-2xl mb-3 group-hover:scale-110 transition-transform">
                    👮‍♀️
                </div>
                <h3 class="text-lg md:text-xl font-black mb-1">我有買女警線上拍立得</h3>
                <div class="mt-4 bg-white/20 hover:bg-white/30 text-xs font-bold px-4 py-2 rounded-full flex items-center space-x-1">
                    <span>點擊前往</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </div>
            </button>

            <!-- 按鈕 2：我沒有買女警線上拍立得 -->
            <button onclick="goToUrl('hasNotBought')" 
                class="group relative bg-slate-800 hover:bg-slate-900 text-white p-6 md:p-8 rounded-3xl shadow-lg hover:shadow-slate-800/30 transition-all duration-300 text-center flex flex-col items-center justify-center transform hover:-translate-y-1">
                <div class="w-14 h-14 bg-white/10 rounded-full flex items-center justify-center text-2xl mb-3 group-hover:scale-110 transition-transform">
                    👗
                </div>
                <h3 class="text-lg md:text-xl font-black mb-1">我沒有買女警線上拍立得</h3>
                <div class="mt-4 bg-white/10 hover:bg-white/20 text-xs font-bold px-4 py-2 rounded-full flex items-center space-x-1">
                    <span>點擊前往</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </div>
            </button>

        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="w-full text-center py-6 text-slate-400 text-xs">
        <p>管樂禮服線上拍立得（只有署名簽名沒有畫畫）</p>
    </footer>

    <!-- JS 連結控制 -->
    <script>
        // 目標連結設定
        const targetUrls = {
            hasBought: "https://a.ecpay.tw/ekcC",     // 我有買女警線上拍立得 的網址
            hasNotBought: "https://a.ecpay.tw/ekdA"    // 我沒有買女警線上拍立得 的網址
        };

        function goToUrl(type) {
            const url = targetUrls[type];
            if (url) {
                window.location.href = url;
            }
        }
    </script>
</body>
</html>
